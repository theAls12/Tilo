/* Layout: a cut-paper puppet theater. One full-screen canvas (960x540 logical, letterboxed on a dark backstage), DOM overlays styled as tickets and pinned cards. Single deliberate look. */
:root{
  --stage:#1a0f1c; --cream:#fff4e0; --ink:#2b1d1a; --red:#e63946; --gold:#e8b94a; --teal:#2a9d8f; --orange:#f28c38;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--stage);color:var(--cream);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font-body)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 16px;text-align:center;z-index:5}
.eyebrow{font-weight:900;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.4)}

function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0||tx>=L.w)return true;const c=L.grid[ty][tx];return c==='#'||c==='='}
function move(b,dt,oneway){let hitX=false;b.x+=b.vx*dt;let x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-.01)/T);
 if(b.vx>0){for(let ty=y0;ty<=y1;ty++)if(solidAt(x1,ty)){b.x=x1*T-b.w;b.vx=0;hitX=true;break}}else if(b.vx<0){for(let ty=y0;ty<=y1;ty++)if(solidAt(x0,ty)){b.x=(x0+1)*T;b.vx=0;hitX=true;break}}
 const pb=b.y+b.h;b.y+=b.vy*dt;b.ground=false;x0=Math.floor(b.x/T);x1=Math.floor((b.x+b.w-.01)/T);y0=Math.floor(b.y/T);y1=Math.floor((b.y+b.h-.01)/T);
 if(b.vy>0){for(let tx=x0;tx<=x1;tx++){const one=oneway&&y1>=0&&y1<ROWS&&tx>=0&&tx<L.w&&L.grid[y1][tx]==='-'&&pb<=y1*T+.5;if(solidAt(tx,y1)||one){b.y=y1*T-b.h;b.vy=0;b.ground=true;break}}}
 else if(b.vy<0){for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,y0)){b.y=(y0+1)*T;b.vy=0;break}}return hitX}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const CONF=['#e63946','#ffd23f','#2a9d8f','#4dabf7','#ff8fa3','#fff4e0','#f28c38','#9b5de5'];
function confetti(arr,x,y,n,spd,o={}){for(let i=0;i<n;i++){const a=o.ang!==undefined?o.ang+(Math.random()-.5)*(o.spread||1):Math.random()*6.283,s=spd*(.3+Math.random()*.9);arr.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),w:4+Math.random()*5,h:3+Math.random()*4,rot:Math.random()*6.3,vr:(Math.random()-.5)*12,fl:Math.random()*6.3,vf:6+Math.random()*10,c:(o.cols||CONF)[i%(o.cols||CONF).length],life:0,max:(o.life||1.2)*(.7+Math.random()*.6),grav:o.grav===undefined?520:o.grav,drag:o.drag||1.8})}}
function scraps(x,y,n,cols,spd){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random()*.8);parts.push({k:'tri',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,r:3+Math.random()*4,rot:Math.random()*6.3,vr:(Math.random()-.5)*14,c:cols[i%cols.length],life:0,max:.6+Math.random()*.4,grav:600,drag:2})}}
function tearApart(s,x,y,flip,cols){const keep={c:copyCanvas(s.c),ox:s.ox,oy:s.oy,w:s.w,h:s.h};for(const side of[0,1])parts.push({k:'half',s:keep,side,x,y,vx:(side?1:-1)*(120+Math.random()*80),vy:-260-Math.random()*120,rot:0,vr:(side?1:-1)*(3+Math.random()*3),flip,life:0,max:1.1,grav:1300,drag:.3});scraps(x,y-10,10,cols,260)}
function copyCanvas(c){const o=mk(c.width,c.height);o.getContext('2d').drawImage(c,0,0);return o}
function ring(x,y,col,r,max=.5){parts.push({k:'ring',x,y,c:col,r,life:0,max})}
function updList(arr,dt){for(const p of arr){if(p.k==='flat'&&p.then&&p.life+dt>=p.max){const f=p.then;p.then=null;f()}}for(const p of arr){p.life+=dt;if(p.k==='ring')continue;const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy=p.vy*d+p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;if(p.vf)p.fl+=p.vf*dt}return arr.filter(p=>p.life<p.max)}
function drawList(g,arr){for(const p of arr){const k=p.life/p.max;if(k<0)continue;const a=k>.75?(1-k)/.25:1;g.globalAlpha=a;
 if(p.k==='conf'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);const f=Math.cos(p.fl);g.scale(1,f);g.fillStyle=f>0?p.c:shade(p.c,-.3);g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}
 else if(p.k==='tri'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);poly(g,[[-p.r,p.r*.7],[0,-p.r],[p.r,p.r*.7]],p.c);g.restore()}
 else if(p.k==='ring'){g.globalAlpha=(1-k)*.8;g.strokeStyle=p.c;g.lineWidth=5*(1-k)+1;g.setLineDash([7,5]);g.beginPath();g.arc(p.x,p.y,p.r*(1-Math.pow(1-k,3)),0,6.3);g.stroke();g.setLineDash([])}
 else if(p.k==='flat'){const q=p.life/p.max;blit(g,p.s,p.x,p.y,{flip:p.flip,sx:1.25+q*.45,sy:.6-q*.3})}
 else if(p.k==='half'){const s=p.s;g.globalAlpha=1;blit(g,s,p.x,p.y,{rot:p.rot,flip:p.flip,alpha:a,clip:p.side?[0,s.oy,s.ox+s.w,s.h]:[s.ox,s.oy,-s.ox,s.h]})}}g.globalAlpha=1}

 if(P.dead>0){P.dead+=dt;parts=updList(parts,dt);updEnts(dt);if(P.dead>1.6)respawn();return}
 const ax=(keys.right?1:0)-(keys.left?1:0);if(ax&&ax!==P.face){P.sx=.72;P.sy=1.2}if(ax)P.face=ax;

 if(P.jbuf>0&&P.coyote>0){P.vy=-JUMP;P.jbuf=0;P.coyote=0;P.sx=.6;P.sy=1.48;SFX.jump();confetti(parts,P.x+12,P.y+P.h,5,90,{cols:[TH.grass[0],TH.body[2]],life:.4,grav:300})}
 if(!keys.jump&&P.vy<-260)P.vy+=GRAV*dt*1.4;

let winClosing=false,hudPop=0,heartPop=0;
function squashUpd(dt){const run=P.ground&&Math.abs(P.vx)>25;let ty=1;if(P.drop>0)ty=1.15;else if(!P.ground)ty=1+clamp(Math.abs(P.vy)/2400,0,.32);else if(run)ty=1+Math.sin(P.anim*30)*.09;else ty=1+Math.sin(time*3)*.035;const tx=1/ty;
 P.vsx=(P.vsx||0)+(tx-P.sx)*520*dt;P.vsy=(P.vsy||0)+(ty-P.sy)*520*dt;const d=Math.exp(-12*dt);P.vsx*=d;P.vsy*=d;P.sx=clamp(P.sx+P.vsx*dt,.45,1.75);P.sy=clamp(P.sy+P.vsy*dt,.45,1.75)}

function updEnts(dt,frozen){for(const e of ents){if(!e.alive)continue;e.ph=(e.ph||0)+dt;
 if(e.t==='m'){e.vy=Math.min(e.vy+GRAV*dt,900);const hit=move(e,dt,true);if(hit)e.vx=-e.vx||46;
   if(e.ground){const ahead=e.vx>0?e.x+e.w+2:e.x-2;const tx=Math.floor(ahead/T),ty=Math.floor((e.y+e.h+3)/T);const plank=ty>=0&&ty<ROWS&&tx>=0&&tx<L.w&&L.grid[ty][tx]==='-';
